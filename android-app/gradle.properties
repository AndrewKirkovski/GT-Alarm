org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
# AGP 9 disables the new built-in Kotlin DSL features so detekt 2.0.0-alpha
# stays compatible. Per detekt 2.0.0 changelog: requires android.newDsl=false
# and android.builtInKotlin=false on AGP 9.0+ until the Detekt 2.x stable
# wires up to the new APIs.
android.builtInKotlin=false
android.newDsl=false

kotlin.code.style=official
ksp.useKSP2=true
