[versions]
agp = "9.1.1"
kotlin = "2.3.21"
ksp = "2.3.7"
detekt = "2.0.0-alpha.3"

composeBom = "2026.04.01"
compileSdk = "36"
targetSdk = "35"
minSdk = "31"

coreKtx = "1.18.0"
lifecycle = "2.10.0"
activityCompose = "1.13.0"
navigationCompose = "2.9.8"
room = "2.8.4"
hilt = "2.59.2"
hiltNavigationCompose = "1.3.0"
coroutines = "1.10.2"
glance = "1.2.0-rc01"
materialIcons = "1.7.6"
materialComponents = "1.12.0"
datastore = "1.2.1"

junit = "4.13.2"
coroutinesTest = "1.10.2"
androidxJunit = "1.3.0"
mockk = "1.14.9"
turbine = "1.2.1"
# Real org.json implementation. Android ships org.json stubs; with
# `unitTests.isReturnDefaultValues = true` (build.gradle.kts) those stubs
# return zeros/empty strings instead of parsing. Tests that need real JSON
# behaviour (WearJsonCodecTest) must override the Android stubs by putting a
# real impl earlier on the test classpath.
orgJson = "20240303"

# Huawei Wear Engine — Sports Watch / Lite Wearable companion track.
# Versions confirmed published at https://developer.huawei.com/repo/ as of
# 2026-04-30: agcp release 1.9.5.302, wearengine release 5.0.1.300.
# AGConnect 1.9.1.x fails to apply on the modern `plugins {}` DSL with AGP 9
# because AGCPlugin.groovy:29 reflects on the legacy buildscript classpath;
# 1.9.5+ is the first line that supports plugin-DSL application cleanly.
huaweiAgconnect = "1.9.5.302"
huaweiWearEngine = "5.0.1.300"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended", version.ref = "materialIcons" }
material-components = { module = "com.google.android.material:material", version.ref = "materialComponents" }

androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-room-testing = { module = "androidx.room:room-testing", version.ref = "room" }

hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }

glance-appwidget = { module = "androidx.glance:glance-appwidget", version.ref = "glance" }
glance-material3 = { module = "androidx.glance:glance-material3", version.ref = "glance" }

androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }

huawei-wearengine = { module = "com.huawei.hms:wearengine", version.ref = "huaweiWearEngine" }

junit = { module = "junit:junit", version.ref = "junit" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutinesTest" }
androidx-junit = { module = "androidx.test.ext:junit", version.ref = "androidxJunit" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
org-json = { module = "org.json:json", version.ref = "orgJson" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
huawei-agconnect = { id = "com.huawei.agconnect", version.ref = "huaweiAgconnect" }
