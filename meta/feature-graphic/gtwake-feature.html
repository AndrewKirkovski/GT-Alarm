<!doctype html>
<!-- GT Wake store feature graphic — 1024x500. Brand-left / devices-right.
     Capture at viewport 1024x500. Palette + ring UI taken from the app:
     #009EDA cyan / #6373F2 indigo / #896BE7 purple / #E058CE magenta. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1024px; height: 500px; }

  .banner {
    position: relative;
    width: 1024px;
    height: 500px;
    overflow: hidden;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    /* vivid brand diagonal gradient */
    background:
      linear-gradient(120deg, #009EDA 0%, #4A6BF0 34%, #6373F2 48%, #896BE7 68%, #E058CE 100%);
  }
  /* darken the left third so white text stays high-contrast */
  .banner::before {
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(90deg,
      rgba(4,10,38,0.62) 0%,
      rgba(4,10,38,0.34) 30%,
      rgba(4,10,38,0.05) 52%,
      transparent 64%);
  }
  /* soft glow behind the devices */
  .banner::after {
    content: "";
    position: absolute;
    right: -60px; top: 50%;
    width: 620px; height: 620px;
    transform: translateY(-50%);
    background: radial-gradient(circle, rgba(255,255,255,0.22) 0%, rgba(255,255,255,0) 60%);
  }

  /* ---------- LEFT: brand + tagline ---------- */
  .left {
    position: absolute;
    left: 64px; top: 0; bottom: 0;
    width: 540px;
    display: flex; flex-direction: column; justify-content: center;
    z-index: 5;
  }
  .brandrow { display: flex; align-items: center; gap: 22px; margin-bottom: 26px; }
  .icon {
    width: 88px; height: 88px;
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 12px 30px rgba(0,0,0,0.35);
    flex: 0 0 auto;
  }
  .icon svg { display: block; width: 88px; height: 88px; }
  .wordmark {
    color: #ffffff;
    font-size: 78px;
    font-weight: 800;
    letter-spacing: -1.5px;
    line-height: 1;
    text-shadow: 0 3px 14px rgba(0,0,0,0.25);
  }
  .tagline {
    color: #ffffff;
    font-size: 38px;
    font-weight: 600;
    line-height: 1.18;
    letter-spacing: -0.3px;
    max-width: 470px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.28);
  }
  .chip {
    margin-top: 30px;
    align-self: flex-start;
    display: inline-flex; align-items: center; gap: 10px;
    padding: 12px 20px;
    border-radius: 999px;
    background: rgba(255,255,255,0.16);
    border: 1px solid rgba(255,255,255,0.34);
    color: #ffffff;
    font-size: 19px; font-weight: 600;
    backdrop-filter: blur(2px);
  }
  .chip .dot { width: 9px; height: 9px; border-radius: 50%; background: #4DF0A0; box-shadow: 0 0 10px #4DF0A0; }

  /* ---------- RIGHT: phone + watch ---------- */
  .right { position: absolute; right: 0; top: 0; width: 470px; height: 500px; z-index: 4; }

  .phone {
    position: absolute;
    right: 66px; top: 50%;
    width: 232px; height: 442px;
    transform: translateY(-50%) rotate(-6deg);
    background: #0b0b14;
    border-radius: 40px;
    padding: 9px;
    box-shadow: 0 26px 60px rgba(0,0,0,0.45);
  }
  .phone .screen {
    width: 100%; height: 100%;
    border-radius: 32px;
    overflow: hidden;
    background: linear-gradient(165deg, #009EDA 0%, #6373F2 42%, #896BE7 66%, #E058CE 100%);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 26px 20px;
    color: #fff;
  }
  .phone .time { font-size: 66px; font-weight: 300; line-height: 1; letter-spacing: -1px; }
  .phone .label { font-size: 18px; font-weight: 400; opacity: 0.92; margin-top: 12px; }
  .phone .pills { width: 100%; margin-top: 54px; display: flex; flex-direction: column; gap: 12px; }
  .phone .pill {
    height: 46px; border-radius: 23px;
    display: flex; align-items: center; justify-content: center;
    font-size: 17px; font-weight: 600;
  }
  .phone .pill.dismiss { background: #fff; color: #111; }
  .phone .pill.snooze { border: 1.5px solid rgba(255,255,255,0.75); color: #fff; }

  .watch {
    position: absolute;
    left: 6px; bottom: 58px;
    width: 178px; height: 178px;
    border-radius: 50%;
    background: #0b0b14;
    padding: 9px;
    transform: rotate(4deg);
    box-shadow: 0 22px 46px rgba(0,0,0,0.5);
    z-index: 2;
  }
  .watch .face {
    width: 100%; height: 100%;
    border-radius: 50%;
    overflow: hidden;
    background: linear-gradient(160deg, #009EDA 0%, #6373F2 48%, #E058CE 100%);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: #fff;
  }
  .watch .wtime { font-size: 46px; font-weight: 300; line-height: 1; letter-spacing: -1px; }
  .watch .wlabel {
    margin-top: 8px;
    font-size: 12px; font-weight: 700; letter-spacing: 1.5px;
    text-transform: uppercase; opacity: 0.9;
  }
</style>
</head>

        <div class="wordmark">GT&nbsp;Wake</div>
      </div>
      <div class="tagline">Never sleep through an alarm.</div>
      <div class="chip"><span class="dot"></span>Phone alarms mirrored to your Huawei Watch GT</div>
    </div>

    <div class="right">
      <div class="phone">
        <div class="screen">
          <div class="time">7:00</div>
          <div class="label">Wake up</div>
          <div class="pills">
            <div class="pill dismiss">Dismiss</div>
            <div class="pill snooze">Snooze</div>
          </div>
        </div>
      </div>
      <div class="watch">
        <div class="face">
          <div class="wtime">7:00</div>

        </div>
      </div>
    </div>

</html>
